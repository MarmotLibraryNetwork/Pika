; priority=99
; Xdebug stays off unless XDEBUG_MODE is set in .env (e.g. XDEBUG_MODE=debug,develop).
; The IDE listens on the Docker host; see documentation/xdebug-setup.md.
xdebug.start_with_request = yes
xdebug.idekey = VSCODE
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.max_nesting_level = 512
